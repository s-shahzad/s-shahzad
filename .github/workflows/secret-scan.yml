name: secret-scan

# Security gate shared by every repo. It scans only the commits a push or pull request
# adds, never the whole history, so old findings (tracked separately) do not block work.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    # NAME IS A CONTRACT: branch protection can require "Secret scan".
    name: Secret scan
    # Automated backup commits are gated locally by backup-work.ps1; skip them here so
    # a 4-hourly backup does not spend Actions minutes.
    if: >-
      github.event_name != 'push' ||
      (!startsWith(github.event.head_commit.message, 'backup snapshot') &&
       !startsWith(github.event.head_commit.message, 'machine state'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Work out the commit range to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            base=$(git merge-base "origin/$BASE_REF" HEAD)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          elif git rev-parse --verify -q "origin/$DEFAULT" >/dev/null && [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$DEFAULT")" ]; then
            base=$(git merge-base "origin/$DEFAULT" HEAD)   # new branch: only what it adds
          else
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Scanning $base..$(git rev-parse HEAD)"

      - name: Install gitleaks 8.18.4 (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: gitleaks on the new commits
        env:
          BASE: ${{ steps.range.outputs.base }}
        run: |
          if [ "$BASE" = "$(git rev-parse HEAD)" ]; then
            echo "No new commits to scan."; exit 0
          fi
          gitleaks detect --source . --log-opts="$BASE..HEAD" --redact --verbose --exit-code 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Private keys, merge markers, large files (changed files only)
        env:
          BASE: ${{ steps.range.outputs.base }}
          SKIP: gitleaks
        run: |
          python -m pip install --quiet pre-commit==3.8.0
          pre-commit run --from-ref "$BASE" --to-ref HEAD --show-diff-on-failure
